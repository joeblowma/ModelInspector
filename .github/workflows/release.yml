name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Get short sha
        uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 7

      - name: Download canonical universal wheel
        uses: actions/download-artifact@v7
        with:
          name: modelinspector-wheel-ubuntu-latest-3.12-${{ steps.short-sha.outputs.sha }}
          path: release-artifacts/wheels

      - name: Download Windows executable
        uses: actions/download-artifact@v7
        with:
          name: modelinspector-windows-${{ steps.short-sha.outputs.sha }}
          path: release-artifacts/windows

      - name: Validate version and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python .github/scripts/prepare_release.py --tag "$RELEASE_TAG"
          --version-file _setVersionHere.txt --wheel-dir release-artifacts/wheels
          --windows-dir release-artifacts/windows --output-dir release-dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes release-dist/*
