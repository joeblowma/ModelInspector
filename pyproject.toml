[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelinspector"
version = "0.1.0"
description = "Index, explore, and organize LLM/Diffusion models"
keywords = ["safetensors", "gguf", "onnx"]

authors = [
    { name = "JBMan", email = "2877235+joeblowma@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = ['PyQt6', 'gguf', 'numpy']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
repository = "https://github.com/ggml-org/llama.cpp"

[project.scripts]
modelinspector-gui = "gui:main"
modelinspector = "inspect_model:main"

[project.optional-dependencies]
winbuild = ['pyinstaller>=6.0.0', 'pillow', ]

[tool.setuptools]
# Explicit flat layout.  The top-level modules and the ``front``/``back``
# packages are installed at the site-packages root so the existing top-level
# imports (``import gui``, ``from front... import ...``, ``from back... import``)
# work unchanged -- no relative-import rewrite.  ``assets`` is mapped beside
# them so the bundled resources keep the same relative layout as the checkout.
package-dir = {"" = "src", "assets" = "assets"}
py-modules = [
    "app_paths",
    "background_tasks",
    "gui",
    "inspect_model",
    "model_cache",
    "model_readers",
    "modelinfo",
]
packages = ["front", "back", "assets", "assets.themes"]

[tool.setuptools.package-data]
assets = ["*.ico", "*.png", "themes/*.jsonc"]
